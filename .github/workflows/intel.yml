name: intel-collect
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: trigger MND daily PLA collector
        run: |
          curl -sS -X POST "https://taiwan-pulse-five.vercel.app/api/intel?action=collect" --max-time 90 || true
