name: river-collect
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: trigger river water-level collector
        run: |
          curl -sS -X POST "https://taiwan-pulse-five.vercel.app/api/board?res=river-collect" --max-time 75 || true
